name: ZeroSE
version: '0.2.0'
slug: zero_assistant
description: Zero with Home Assistant administrator access through Ingress
url: https://github.com/fixtse/ZeroSE
arch: [amd64, aarch64]
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8788
ingress_entry: /admin/
panel_admin: true
homeassistant_api: true
options:
  database_backend: postgres
  database_url: ''
schema:
  database_backend: list(postgres|pglite)?
  database_url: password?
