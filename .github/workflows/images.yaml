name: Test and publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm
        env:
          POSTGRES_DB: assistant_test
          POSTGRES_USER: assistant
          POSTGRES_PASSWORD: test-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U assistant -d assistant_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      ASSISTANT_POSTGRES_PASSWORD: compose-validation-only
      TEST_DATABASE_URL: postgresql://assistant:test-only-password@127.0.0.1:5432/assistant_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - name: Initialize test extension
        run: node --input-type=module -e "import pg from 'pg'; const c=new pg.Client({connectionString:process.env.TEST_DATABASE_URL}); await c.connect(); await c.query('CREATE EXTENSION IF NOT EXISTS vector'); await c.end();"
      - run: pnpm test
      - run: pnpm build
      - name: Validate deployment definitions
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet

  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Image coordinates
        id: coordinates
        env:
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          image="${GITHUB_REPOSITORY,,}"
          owner_kind=users
          if [[ "$OWNER_TYPE" == Organization ]]; then owner_kind=orgs; fi
          echo "image=ghcr.io/$image" >> "$GITHUB_OUTPUT"
          echo "package_api=$owner_kind/${image%%/*}/packages/container/${image#*/}" >> "$GITHUB_OUTPUT"
      - name: Refuse an existing public package
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_API: ${{ steps.coordinates.outputs.package_api }}
        run: |
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/package.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/$PACKAGE_API")
          case "$status" in
            200) test "$(jq -r '.visibility' "$RUNNER_TEMP/package.json")" = private ;;
            404) echo 'A new GHCR package will be private by default.' ;;
            *) echo "::error::Cannot verify package visibility (HTTP $status)"; exit 1 ;;
          esac
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        if: github.event_name != 'pull_request'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: metadata
        with:
          images: ${{ steps.coordinates.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          target: runtime
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=min
      - name: Verify published package is private
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_API: ${{ steps.coordinates.outputs.package_api }}
          IMAGE: ${{ steps.coordinates.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/package.json" --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/$PACKAGE_API")
            if [[ "$status" == 200 ]]; then
              test "$(jq -r '.visibility' "$RUNNER_TEMP/package.json")" = private
              echo "Published private image: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 3
          done
          echo '::error::Could not confirm private package visibility after publishing.'
          exit 1
