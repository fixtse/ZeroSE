name: fixt-assistant
services:
  assistant:
    image: ${ASSISTANT_IMAGE:-ghcr.io/fixtse/zero-assistant:latest}
    pull_policy: always
    container_name: fixt-assistant
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    network_mode: host
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_HOST: ${ASSISTANT_HOST:-127.0.0.1}
      ASSISTANT_CODEX_HOME: /codex
      ASSISTANT_DISCOVERY: ${ASSISTANT_DISCOVERY:-true}
      ASSISTANT_ADMIN_URL: ${ASSISTANT_ADMIN_URL:-http://localhost:8788}
      ASSISTANT_DEPLOY_WEBHOOK_URL: ${ASSISTANT_DEPLOY_WEBHOOK_URL:-}
      ASSISTANT_SECRETS_KEY: ${ASSISTANT_SECRETS_KEY:-}
      ASSISTANT_PHOTON_URL: ${ASSISTANT_PHOTON_URL:-https://photon.komoot.io}
      ASSISTANT_OSRM_URL: ${ASSISTANT_OSRM_URL:-https://router.project-osrm.org}
      ASSISTANT_DATABASE_URL: postgresql://assistant:${ASSISTANT_POSTGRES_PASSWORD:?Set ASSISTANT_POSTGRES_PASSWORD in .env}@127.0.0.1:${ASSISTANT_POSTGRES_PORT:-55432}/assistant
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    volumes:
      - type: bind
        source: ${ASSISTANT_DATA_DIR:-./data}
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ${ASSISTANT_CODEX_HOME:-${HOME}/.codex}
        target: /codex
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: ${ASSISTANT_POSTGRES_PASSWORD:?Set ASSISTANT_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ASSISTANT_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres-data:
